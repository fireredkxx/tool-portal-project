<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-name" href="index.html">Tool Portal</a>
      <button type="button" class="theme-toggle" aria-pressed="false">Switch to dark theme</button>
    </div>
  </header>

  <main class="container">
    <h1>Tools</h1>
    <p class="lead">Small web tools for STEM students. Pick a tool to try it out.</p>

    <!-- Tool cards. To add a tool: create tools/<tool-name>/index.html,
         then copy one <li> below and update its link, tag, name and description. -->
    <ul class="tool-grid">
      <li>
        <a class="tool-card" href="tools/tool-1/index.html">
          <span class="tag">Placeholder</span>
          <h2>Tool 1 – coming soon</h2>
          <p>A placeholder to check that opening a tool and coming back works.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
